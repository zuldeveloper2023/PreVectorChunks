[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prevectorchunks-core"
version = "0.1.41"
description = "A Python module that allows conversion of a document into chunks to be inserted into Pinecone vector database"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.7,<3.12"
authors = [
    { name = "Zul Al-Kabir", email = "zul.developer.2023@gmail.com" }
]


dependencies = [
    "Django==5.1",
    "django-cors-headers~=4.4.0",
    "fastapi~=0.112.2",
    "PyJWT~=2.7.0",
    "langchain-text-splitters~=0.3.11",
    "openai~=2.6.0",
    "pinecone~=7.3.0",
    "python-dotenv~=1.0.1",
    "pytesseract~=0.3.13",
    "python-docx~=1.2.0",
    "PyPDF2~=3.0.1",
    "pillow~=11.3.0",
    "datasets~=4.1.1",
    "torch~=2.6.0",
    "torchvision~=0.21.0",
    "torchaudio~=2.6.0",
    "sentence-transformers~=5.1.1",
    "pathlib~=1.0.1",
    "transformers~=4.57.0",
    "imageio-ffmpeg~=0.6.0",
    "opencv-python~=4.12.0.88",
    "requests~=2.32.5",
    "langchain~=1.3.9",
    "langchain-openai~=1.0.0",
    "pdf2image~=1.17.0",
    "docx2pdf~=0.1.8",
    "numpy~=2.2.6",
    "scikit-learn~=1.7.2",
    "PyMuPDF~=1.26.0",
    "pypandoc~=1.15",
    "reportlab~=4.2.5",
    "langchainhub~=0.1.21",
    "python-pptx~=1.0.2"
    #"fitz~=0.0.1.dev2",
]



[tool.setuptools.packages.find]
where = ["."]
include = ["prevectorchunks_core*"]

[tool.setuptools.package-data]
"prevectorchunks_core.rlchunker.pretrained" = ["*.pt", "*.txt"]

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[project.urls]
Homepage = "https://github.com/zuldeveloper2023/PreVectorChunks"
Source = "https://github.com/zuldeveloper2023/PreVectorChunks"
